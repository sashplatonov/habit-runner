<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="How to Track Habits Without Obsessing">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#ecfeff"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="130" fill="#34d399" opacity="0.10"/>
  <circle cx="1090" cy="520" r="150" fill="#06b6d4" opacity="0.10"/>

  <!-- balance scale -->
  <!-- fulcrum -->
  <polygon points="600,420 560,490 640,490" fill="#e2e8f0"/>
  <rect x="580" y="490" width="40" height="20" rx="6" fill="#cbd5e1"/>
  <!-- beam -->
  <line x1="300" y1="295" x2="900" y2="295" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="295" x2="600" y2="420" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <!-- left pan: healthy tracking -->
  <ellipse cx="300" cy="350" rx="110" ry="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="295" x2="260" y2="332" stroke="#94a3b8" stroke-width="3"/>
  <line x1="300" y1="295" x2="340" y2="332" stroke="#94a3b8" stroke-width="3"/>
  <rect x="215" y="280" width="170" height="70" rx="16" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="300" y="310" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#065f46" text-anchor="middle">Healthy tracking</text>
  <text x="300" y="330" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">1 check-in / day</text>

  <!-- right pan: obsessing -->
  <ellipse cx="900" cy="310" rx="110" ry="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" transform="rotate(-5 900 310)"/>
  <line x1="900" y1="295" x2="860" y2="292" stroke="#94a3b8" stroke-width="3"/>
  <line x1="900" y1="295" x2="940" y2="292" stroke="#94a3b8" stroke-width="3"/>
  <rect x="820" y="234" width="160" height="70" rx="16" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="900" y="264" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#7f1d1d" text-anchor="middle">Obsessing</text>
  <text x="900" y="284" font-family="Inter,Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">10× checks / day</text>

  <!-- beam slightly left-weighted (healthy) -->

  <!-- insight text -->
  <rect x="350" y="510" width="500" height="68" rx="16" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="600" y="543" font-family="Inter,Arial,sans-serif" font-size="16" fill="#065f46" text-anchor="middle" font-weight="600">The app should serve the habit — not be the habit.</text>
  <text x="600" y="566" font-family="Inter,Arial,sans-serif" font-size="14" fill="#047857" text-anchor="middle">Log once. Move on. Let streaks measure momentum.</text>

  <text x="600" y="48" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">Track Habits Without Obsessing</text>
  <text x="600" y="88" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">The right balance between awareness and fixation</text>
</svg>
