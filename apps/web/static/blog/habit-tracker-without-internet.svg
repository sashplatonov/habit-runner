<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Habit Tracker Without Internet">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="140" fill="#34d399" opacity="0.08"/>
  <circle cx="1050" cy="500" r="150" fill="#94a3b8" opacity="0.08"/>

  <!-- phone -->
  <rect x="390" y="90" width="200" height="360" rx="28" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="403" y="112" width="174" height="312" rx="16" fill="#f8fafc"/>
  <!-- habit list on phone -->
  <rect x="413" y="124" width="154" height="38" rx="10" fill="#ecfdf5"/>
  <circle cx="433" cy="143" r="11" fill="#10b981"/>
  <path d="M426 143 L431 148 L441 137" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="450" y="147" font-family="Inter,Arial,sans-serif" font-size="13" fill="#065f46">Morning walk</text>
  <rect x="413" y="170" width="154" height="38" rx="10" fill="#ecfdf5"/>
  <circle cx="433" cy="189" r="11" fill="#10b981"/>
  <path d="M426 189 L431 194 L441 183" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="450" y="193" font-family="Inter,Arial,sans-serif" font-size="13" fill="#065f46">Hydration</text>
  <rect x="413" y="216" width="154" height="38" rx="10" fill="#f1f5f9"/>
  <circle cx="433" cy="235" r="11" fill="#e2e8f0"/>
  <text x="450" y="239" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8">Reading</text>
  <rect x="413" y="262" width="154" height="38" rx="10" fill="#f1f5f9"/>
  <circle cx="433" cy="281" r="11" fill="#e2e8f0"/>
  <text x="450" y="285" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8">Meditation</text>
  <!-- streak badge on phone -->
  <rect x="413" y="318" width="154" height="38" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="490" y="341" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">🔥 14-day streak</text>
  <!-- storage note -->
  <rect x="413" y="368" width="154" height="38" rx="10" fill="#f1f5f9"/>
  <text x="490" y="391" font-family="Inter,Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">Saved on device</text>

  <!-- wifi off symbol (large) -->
  <g transform="translate(700, 190)">
    <path d="M-120,0 C-120,-80 120,-80 120,0" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
    <path d="M-80,45 C-80,-20 80,-20 80,45" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
    <path d="M-40,90 C-40,55 40,55 40,90" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="125" r="14" fill="#e2e8f0"/>
    <!-- red X -->
    <line x1="-80" y1="-50" x2="80" y2="140" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <line x1="80" y1="-50" x2="-80" y2="140" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- still works badge -->
  <rect x="800" y="340" width="260" height="80" rx="20" fill="#d1fae5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="930" y="375" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">Still works ✓</text>
  <text x="930" y="400" font-family="Inter,Arial,sans-serif" font-size="15" fill="#047857" text-anchor="middle">100% offline</text>

  <text x="600" y="545" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">Habit Tracker Without Internet</text>
  <text x="600" y="583" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Your habits stay intact — online or offline</text>
</svg>
