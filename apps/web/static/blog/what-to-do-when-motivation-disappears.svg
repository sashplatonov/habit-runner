<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="What to Do When Motivation Disappears">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0f9ff"/></linearGradient>
    <linearGradient id="lineUp" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#94a3b8"/><stop offset="40%" stop-color="#94a3b8"/><stop offset="55%" stop-color="#ef4444"/><stop offset="70%" stop-color="#f97316"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- chart area -->
  <rect x="140" y="110" width="920" height="370" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- y axis label -->
  <text x="175" y="140" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" transform="rotate(-90, 175, 140)" text-anchor="middle">Motivation</text>
  <!-- gridlines -->
  <line x1="200" y1="160" x2="1020" y2="160" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="200" y1="230" x2="1020" y2="230" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="200" y1="300" x2="1020" y2="300" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="200" y1="370" x2="1020" y2="370" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="200" y1="160" x2="200" y2="440" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="200" y1="440" x2="1020" y2="440" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- motivation path: rises, dips, rises -->
  <polyline points="200,380 260,360 320,300 380,220 440,200 500,240 560,340 580,420 600,430 640,400 700,340 760,280 820,240 880,210 940,190 1000,175" fill="none" stroke="url(#lineUp)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- filled area under curve -->
  <path d="M200,380 260,360 320,300 380,220 440,200 500,240 560,340 580,420 600,430 640,400 700,340 760,280 820,240 880,210 940,190 1000,175 1000,440 200,440Z" fill="#f0fdf4" opacity="0.5"/>
  <path d="M500,240 560,340 580,420 600,430 640,400 700,340 700,440 500,440Z" fill="#fee2e2" opacity="0.4"/>

  <!-- labels -->
  <text x="420" y="190" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">honeymoon</text>
  <text x="560" y="400" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ef4444" font-weight="600">dip</text>
  <text x="860" y="200" font-family="Inter,Arial,sans-serif" font-size="13" fill="#059669" font-weight="600">habit formed</text>

  <!-- motivation-dip annotation -->
  <line x1="590" y1="435" x2="590" y2="460" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="590" y="476" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ef4444" text-anchor="middle">motivation drops here</text>

  <!-- arrow up at end -->
  <path d="M990 195 L1000 175 L1010 195" fill="#059669"/>

  <!-- x-axis labels -->
  <text x="280" y="462" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Week 1</text>
  <text x="490" y="462" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Week 3</text>
  <text x="700" y="462" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Week 6</text>
  <text x="900" y="462" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Month 3</text>

  <text x="600" y="551" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">When Motivation Disappears</text>
  <text x="600" y="590" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">The dip is normal — here's how to push through it</text>
</svg>
