<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Local-First Productivity Apps">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="device" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="280" r="240" fill="#0ea5e9" opacity="0.06"/>

  <!-- device (laptop) -->
  <rect x="320" y="140" width="560" height="340" rx="16" fill="url(#device)"/>
  <rect x="340" y="158" width="520" height="302" rx="8" fill="#1e293b"/>
  <!-- screen content -->
  <rect x="358" y="172" width="484" height="274" rx="6" fill="#0f172a"/>

  <!-- local storage visual on screen -->
  <text x="600" y="212" font-family="Inter,monospace,sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">● Local-first architecture</text>

  <!-- drive icon on screen -->
  <rect x="480" y="228" width="240" height="110" rx="14" fill="#1e3a5f" stroke="#0284c7" stroke-width="1.5"/>
  <!-- disk layers -->
  <ellipse cx="600" cy="248" rx="70" ry="18" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="530" y="248" width="140" height="40" fill="#0369a1"/>
  <ellipse cx="600" cy="288" rx="70" ry="18" fill="#075985" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="530" y="288" width="140" height="30" fill="#075985"/>
  <ellipse cx="600" cy="318" rx="70" ry="18" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- IndexedDB label -->
  <text x="600" y="266" font-family="monospace,sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">IndexedDB</text>
  <text x="600" y="304" font-family="monospace,sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">Dexie.js</text>
  <text x="600" y="322" font-family="monospace,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">your device</text>

  <!-- laptop base -->
  <rect x="270" y="480" width="660" height="18" rx="6" fill="#475569"/>
  <rect x="520" y="480" width="160" height="8" rx="3" fill="#334155"/>

  <!-- benefits badges -->
  <rect x="80" y="220" width="190" height="54" rx="14" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="175" y="243" font-family="Inter,Arial,sans-serif" font-size="14" fill="#065f46" text-anchor="middle" font-weight="600">Works offline</text>
  <text x="175" y="263" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">always available</text>

  <rect x="80" y="298" width="190" height="54" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="175" y="321" font-family="Inter,Arial,sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">Zero latency</text>
  <text x="175" y="341" font-family="Inter,Arial,sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle">instant reads</text>

  <rect x="80" y="376" width="190" height="54" rx="14" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="175" y="399" font-family="Inter,Arial,sans-serif" font-size="14" fill="#581c87" text-anchor="middle" font-weight="600">Privacy first</text>
  <text x="175" y="419" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">your data, your device</text>

  <rect x="930" y="220" width="190" height="54" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1025" y="243" font-family="Inter,Arial,sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="600">Sync optional</text>
  <text x="1025" y="263" font-family="Inter,Arial,sans-serif" font-size="13" fill="#c2410c" text-anchor="middle">you control it</text>

  <rect x="930" y="298" width="190" height="54" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="1025" y="321" font-family="Inter,Arial,sans-serif" font-size="14" fill="#065f46" text-anchor="middle" font-weight="600">No account lock</text>
  <text x="1025" y="341" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">export anytime</text>

  <rect x="930" y="376" width="190" height="54" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="1025" y="399" font-family="Inter,Arial,sans-serif" font-size="14" fill="#0c4a6e" text-anchor="middle" font-weight="600">Survives shutdown</text>
  <text x="1025" y="419" font-family="Inter,Arial,sans-serif" font-size="13" fill="#0369a1" text-anchor="middle">app goes away, data stays</text>

  <text x="600" y="553" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Local-First Productivity Apps</text>
  <text x="600" y="592" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Why your data should live on your device first</text>
</svg>
