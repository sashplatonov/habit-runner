<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="How to Stop Abandoning Habits">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0fdf4"/></linearGradient>
    <linearGradient id="arrow" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="50%" stop-color="#f97316"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="500" r="160" fill="#10b981" opacity="0.08"/>

  <!-- U-turn path -->
  <path d="M180,250 L500,250 Q600,250 600,350 Q600,450 500,450 L260,450" fill="none" stroke="url(#arrow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead at return -->
  <polygon points="260,432 220,450 260,468" fill="#10b981"/>

  <!-- start label -->
  <circle cx="180" cy="250" r="28" fill="#ef4444"/>
  <text x="180" y="256" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">quit</text>

  <!-- return label -->
  <circle cx="220" cy="450" r="28" fill="#10b981"/>
  <text x="220" y="456" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">back</text>

  <!-- phases along the curve -->
  <rect x="530" y="180" width="180" height="56" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="620" y="208" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="600">Abandon point</text>
  <text x="620" y="228" font-family="Inter,Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">too hard / forgot</text>

  <rect x="510" y="440" width="200" height="56" rx="14" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="610" y="468" font-family="Inter,Arial,sans-serif" font-size="15" fill="#065f46" text-anchor="middle" font-weight="600">Recovery point</text>
  <text x="610" y="488" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">smaller + scheduled</text>

  <!-- strategies panel -->
  <rect x="740" y="160" width="380" height="320" rx="20" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
  <text x="930" y="198" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Stop abandoning habits</text>
  <line x1="760" y1="212" x2="1100" y2="212" stroke="#f0fdf4" stroke-width="1"/>
  <text x="770" y="244" font-family="Inter,Arial,sans-serif" font-size="15" fill="#059669">✓  Make it smaller</text>
  <text x="770" y="276" font-family="Inter,Arial,sans-serif" font-size="15" fill="#059669">✓  Attach to existing habit</text>
  <text x="770" y="308" font-family="Inter,Arial,sans-serif" font-size="15" fill="#059669">✓  Track misses, not just wins</text>
  <text x="770" y="340" font-family="Inter,Arial,sans-serif" font-size="15" fill="#059669">✓  Reduce to 2-minute version</text>
  <text x="770" y="372" font-family="Inter,Arial,sans-serif" font-size="15" fill="#059669">✓  Never miss twice in a row</text>
  <text x="770" y="404" font-family="Inter,Arial,sans-serif" font-size="15" fill="#059669">✓  Review weekly, adjust monthly</text>
  <text x="770" y="436" font-family="Inter,Arial,sans-serif" font-size="15" fill="#059669">✓  Use freeze days strategically</text>

  <text x="600" y="557" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">How to Stop Abandoning Habits</text>
  <text x="600" y="595" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Break the quit-restart cycle for good</text>
</svg>
