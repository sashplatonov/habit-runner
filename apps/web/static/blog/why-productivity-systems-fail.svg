<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Why Productivity Systems Fail">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- left: complex flowchart -->
  <rect x="60" y="100" width="480" height="380" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="300" y="136" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#7c3aed" text-anchor="middle">Complex system</text>

  <!-- boxes and arrows -->
  <rect x="220" y="150" width="160" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="300" y="172" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">Morning ritual</text>
  <line x1="300" y1="186" x2="300" y2="204" stroke="#a78bfa" stroke-width="2"/>
  <rect x="160" y="204" width="140" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="230" y="226" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">Energy level?</text>
  <rect x="320" y="204" width="140" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="390" y="226" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">Review goals</text>
  <line x1="300" y1="186" x2="230" y2="204" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="300" y1="186" x2="390" y2="204" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="230" y1="240" x2="230" y2="258" stroke="#a78bfa" stroke-width="2"/>
  <rect x="100" y="258" width="130" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="165" y="280" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">Deep work</text>
  <rect x="250" y="258" width="130" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="315" y="280" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">Admin tasks</text>
  <line x1="390" y1="240" x2="390" y2="258" stroke="#a78bfa" stroke-width="2"/>
  <rect x="310" y="314" width="160" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="390" y="336" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">OKR check-in</text>
  <line x1="165" y1="294" x2="165" y2="350" stroke="#a78bfa" stroke-width="2"/>
  <rect x="100" y="350" width="130" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="165" y="372" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">Time block</text>
  <line x1="165" y1="386" x2="165" y2="404" stroke="#a78bfa" stroke-width="2"/>
  <rect x="100" y="404" width="130" height="36" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="165" y="426" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle">Evening review</text>

  <!-- collapse label -->
  <text x="300" y="468" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="600">Abandoned by week 2 ✗</text>

  <!-- VS divider -->
  <text x="600" y="310" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="900" fill="#94a3b8" text-anchor="middle">VS</text>

  <!-- right: simple dot -->
  <rect x="660" y="100" width="480" height="380" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="900" y="136" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#059669" text-anchor="middle">Simple system</text>

  <circle cx="900" cy="295" r="90" fill="#d1fae5" stroke="#34d399" stroke-width="4"/>
  <text x="900" y="282" font-family="Inter,Arial,sans-serif" font-size="15" fill="#065f46" text-anchor="middle" font-weight="600">3 habits.</text>
  <text x="900" y="308" font-family="Inter,Arial,sans-serif" font-size="15" fill="#065f46" text-anchor="middle" font-weight="600">Track daily.</text>
  <text x="900" y="334" font-family="Inter,Arial,sans-serif" font-size="15" fill="#065f46" text-anchor="middle" font-weight="600">Review weekly.</text>

  <text x="900" y="470" font-family="Inter,Arial,sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="600">Still running after 6 months ✓</text>

  <text x="600" y="557" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Why Productivity Systems Fail</text>
  <text x="600" y="595" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Complexity is the enemy of consistency</text>
</svg>
