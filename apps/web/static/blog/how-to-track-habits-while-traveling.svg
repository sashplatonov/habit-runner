<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="How to Track Habits While Traveling">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- sky panel -->
  <rect x="200" y="100" width="800" height="300" rx="28" fill="url(#sky)"/>
  <!-- airplane simplified -->
  <g transform="translate(380, 200) rotate(-10)">
    <path d="M0 40 L120 0 L200 30 L120 60Z" fill="#0284c7"/>
    <path d="M80 55 L140 100 L100 60Z" fill="#0369a1"/>
    <path d="M160 20 L220 0 L200 30Z" fill="#0284c7"/>
    <path d="M20 50 L60 80 L50 60Z" fill="#0369a1"/>
  </g>
  <!-- dotted path -->
  <line x1="300" y1="250" x2="900" y2="180" stroke="#93c5fd" stroke-width="3" stroke-dasharray="12 8"/>
  <!-- location pins -->
  <circle cx="300" cy="250" r="16" fill="#3b82f6"/>
  <circle cx="300" cy="250" r="8" fill="#ffffff"/>
  <circle cx="900" cy="180" r="16" fill="#10b981"/>
  <circle cx="900" cy="180" r="8" fill="#ffffff"/>

  <!-- habit checklist panel -->
  <rect x="700" y="340" width="320" height="180" rx="20" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="860" y="374" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">On the road</text>
  <!-- checkmarks -->
  <circle cx="740" cy="402" r="12" fill="#10b981"/><path d="M733 402 L739 408 L748 396" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="762" y="407" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">Morning walk</text>
  <circle cx="740" cy="432" r="12" fill="#10b981"/><path d="M733 432 L739 438 L748 426" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="762" y="437" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">Hydration</text>
  <circle cx="740" cy="462" r="12" fill="#e2e8f0"/><text x="762" y="467" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94a3b8">Evening journal</text>
  <circle cx="740" cy="492" r="12" fill="#e2e8f0"/><text x="762" y="497" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94a3b8">Reading</text>

  <text x="600" y="560" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Track Habits While Traveling</text>
  <text x="600" y="598" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Offline-ready habits that follow you anywhere</text>
</svg>
