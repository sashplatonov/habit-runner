<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Habit Tracker for Students">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#f0fdf4"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="130" fill="#3b82f6" opacity="0.10"/>
  <circle cx="1050" cy="500" r="150" fill="#10b981" opacity="0.10"/>

  <!-- graduation cap -->
  <polygon points="600,80 450,150 600,220 750,150" fill="#1d4ed8"/>
  <polygon points="600,220 680,185 680,240 660,248 600,260 540,248 520,240 520,185" fill="#2563eb"/>
  <line x1="750" y1="150" x2="750" y2="205" stroke="#1d4ed8" stroke-width="6"/>
  <circle cx="750" cy="218" r="12" fill="#1d4ed8"/>

  <!-- study habit grid -->
  <rect x="180" y="290" width="840" height="240" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <!-- columns -->
  <text x="285" y="326" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Mon</text>
  <text x="390" y="326" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Tue</text>
  <text x="495" y="326" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Wed</text>
  <text x="600" y="326" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Thu</text>
  <text x="705" y="326" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Fri</text>
  <text x="810" y="326" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Sat</text>
  <text x="915" y="326" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Sun</text>

  <!-- habit rows -->
  <!-- row 1 -->
  <text x="215" y="365" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Study 2h</text>
  <rect x="258" y="344" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="285" y="365" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="363" y="344" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="390" y="365" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="468" y="344" width="54" height="32" rx="8" fill="#fee2e2"/>
  <text x="495" y="365" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✗</text>
  <rect x="573" y="344" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="600" y="365" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="678" y="344" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="705" y="365" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="783" y="344" width="54" height="32" rx="8" fill="#d1fae5"/>
  <text x="810" y="365" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="888" y="344" width="54" height="32" rx="8" fill="#f1f5f9"/>
  <text x="915" y="365" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">–</text>

  <!-- row 2 -->
  <text x="215" y="413" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Exercise</text>
  <rect x="258" y="392" width="54" height="32" rx="8" fill="#d1fae5"/>
  <text x="285" y="413" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="363" y="392" width="54" height="32" rx="8" fill="#fee2e2"/>
  <text x="390" y="413" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✗</text>
  <rect x="468" y="392" width="54" height="32" rx="8" fill="#d1fae5"/>
  <text x="495" y="413" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="573" y="392" width="54" height="32" rx="8" fill="#d1fae5"/>
  <text x="600" y="413" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="678" y="392" width="54" height="32" rx="8" fill="#fee2e2"/>
  <text x="705" y="413" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✗</text>
  <rect x="783" y="392" width="54" height="32" rx="8" fill="#d1fae5"/>
  <text x="810" y="413" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="888" y="392" width="54" height="32" rx="8" fill="#d1fae5"/>
  <text x="915" y="413" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>

  <!-- row 3 -->
  <text x="215" y="461" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">No phone 1h</text>
  <rect x="258" y="440" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="285" y="461" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="363" y="440" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="390" y="461" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="468" y="440" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="495" y="461" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="573" y="440" width="54" height="32" rx="8" fill="#fee2e2"/>
  <text x="600" y="461" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✗</text>
  <rect x="678" y="440" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="705" y="461" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>
  <rect x="783" y="440" width="54" height="32" rx="8" fill="#f1f5f9"/>
  <text x="810" y="461" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">–</text>
  <rect x="888" y="440" width="54" height="32" rx="8" fill="#dbeafe"/>
  <text x="915" y="461" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">✓</text>

  <text x="600" y="555" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Habit Tracker for Students</text>
  <text x="600" y="593" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Build study habits that survive exam season</text>
</svg>
