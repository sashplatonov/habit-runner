<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Minimalist Habit Tracker">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- three clean habit rows — very minimal -->
  <rect x="300" y="120" width="600" height="360" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header -->
  <text x="600" y="168" font-family="Inter,Arial,sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">TODAY</text>
  <line x1="340" y1="184" x2="860" y2="184" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- row 1 -->
  <line x1="340" y1="224" x2="860" y2="224" stroke="#f8fafc" stroke-width="1"/>
  <circle cx="378" cy="232" r="18" fill="#0f172a"/>
  <path d="M368 232 L375 239 L389 224" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="416" y="237" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">Run</text>
  <text x="840" y="237" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="end">12 day streak</text>

  <line x1="340" y1="280" x2="860" y2="280" stroke="#f8fafc" stroke-width="1"/>
  <!-- row 2 -->
  <circle cx="378" cy="310" r="18" fill="#0f172a"/>
  <path d="M368 310 L375 317 L389 302" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="416" y="315" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">Read</text>
  <text x="840" y="315" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="end">7 day streak</text>

  <line x1="340" y1="346" x2="860" y2="346" stroke="#f8fafc" stroke-width="1"/>
  <!-- row 3 -->
  <circle cx="378" cy="376" r="18" fill="#e2e8f0"/>
  <text x="416" y="381" font-family="Inter,Arial,sans-serif" font-size="20" fill="#94a3b8">Meditate</text>
  <text x="840" y="381" font-family="Inter,Arial,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="end">not yet</text>

  <line x1="340" y1="412" x2="860" y2="412" stroke="#f8fafc" stroke-width="1"/>
  <!-- row 4 -->
  <circle cx="378" cy="442" r="18" fill="#0f172a"/>
  <path d="M368 442 L375 449 L389 434" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="416" y="447" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">Water</text>
  <text x="840" y="447" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="end">21 day streak</text>

  <text x="600" y="547" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">The Minimalist Habit Tracker</text>
  <text x="600" y="585" font-family="Inter,Arial,sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Less complexity. More consistency.</text>
</svg>
