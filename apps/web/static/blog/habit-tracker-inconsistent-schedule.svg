<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Habit Tracker for Inconsistent Schedule">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fdf8f0"/><stop offset="100%" stop-color="#fef3c7"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="140" fill="#fbbf24" opacity="0.12"/>
  <circle cx="1100" cy="540" r="150" fill="#f59e0b" opacity="0.10"/>

  <!-- calendar grid: 5x4 -->
  <rect x="250" y="110" width="700" height="380" rx="24" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
  <text x="600" y="152" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a" text-anchor="middle">This Week</text>

  <!-- calendar row headers -->
  <text x="305" y="188" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Mon</text>
  <text x="420" y="188" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Tue</text>
  <text x="535" y="188" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Wed</text>
  <text x="650" y="188" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Thu</text>
  <text x="765" y="188" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Fri</text>
  <text x="880" y="188" font-family="Inter,Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Sat</text>

  <!-- habit 1 row: consistent -->
  <text x="270" y="228" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Morning walk</text>
  <rect x="280" y="205" width="80" height="36" rx="10" fill="#d1fae5"/><text x="320" y="228" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="395" y="205" width="80" height="36" rx="10" fill="#d1fae5"/><text x="435" y="228" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="510" y="205" width="80" height="36" rx="10" fill="#fef3c7"/><text x="550" y="228" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">~</text>
  <rect x="625" y="205" width="80" height="36" rx="10" fill="#d1fae5"/><text x="665" y="228" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="740" y="205" width="80" height="36" rx="10" fill="#fee2e2"/><text x="780" y="228" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✗</text>
  <rect x="855" y="205" width="80" height="36" rx="10" fill="#d1fae5"/><text x="895" y="228" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>

  <!-- habit 2 row: irregular -->
  <text x="270" y="280" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Read 15 min</text>
  <rect x="280" y="257" width="80" height="36" rx="10" fill="#fee2e2"/><text x="320" y="280" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✗</text>
  <rect x="395" y="257" width="80" height="36" rx="10" fill="#fee2e2"/><text x="435" y="280" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✗</text>
  <rect x="510" y="257" width="80" height="36" rx="10" fill="#d1fae5"/><text x="550" y="280" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="625" y="257" width="80" height="36" rx="10" fill="#fef3c7"/><text x="665" y="280" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">~</text>
  <rect x="740" y="257" width="80" height="36" rx="10" fill="#d1fae5"/><text x="780" y="280" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="855" y="257" width="80" height="36" rx="10" fill="#d1fae5"/><text x="895" y="280" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>

  <!-- habit 3 -->
  <text x="270" y="332" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Meditate</text>
  <rect x="280" y="309" width="80" height="36" rx="10" fill="#d1fae5"/><text x="320" y="332" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="395" y="309" width="80" height="36" rx="10" fill="#fee2e2"/><text x="435" y="332" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✗</text>
  <rect x="510" y="309" width="80" height="36" rx="10" fill="#fee2e2"/><text x="550" y="332" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✗</text>
  <rect x="625" y="309" width="80" height="36" rx="10" fill="#d1fae5"/><text x="665" y="332" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="740" y="309" width="80" height="36" rx="10" fill="#d1fae5"/><text x="780" y="332" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">✓</text>
  <rect x="855" y="309" width="80" height="36" rx="10" fill="#fef3c7"/><text x="895" y="332" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">~</text>

  <!-- insight badge -->
  <rect x="280" y="380" width="640" height="80" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="600" y="415" font-family="Inter,Arial,sans-serif" font-size="16" fill="#92400e" text-anchor="middle" font-weight="600">Good enough is good enough — 4/6 days still builds the habit.</text>
  <text x="600" y="440" font-family="Inter,Arial,sans-serif" font-size="15" fill="#a16207" text-anchor="middle">Set flexible targets, not all-or-nothing streaks.</text>

  <text x="600" y="548" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Habit Tracking on an Inconsistent Schedule</text>
  <text x="600" y="585" font-family="Inter,Arial,sans-serif" font-size="19" fill="#78716c" text-anchor="middle">Flexible systems that survive messy weeks</text>
</svg>
