<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Why Habit Tracking Stops Working">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#fef9c3"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="130" r="120" fill="#f59e0b" opacity="0.08"/>

  <!-- plateau chart -->
  <rect x="120" y="80" width="960" height="400" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="118" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">Progress Over Time</text>

  <!-- y-axis labels -->
  <text x="155" y="162" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">100%</text>
  <text x="155" y="222" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">80%</text>
  <text x="155" y="282" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">60%</text>
  <text x="155" y="342" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">40%</text>
  <text x="155" y="402" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">20%</text>
  <text x="155" y="452" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">0%</text>

  <!-- gridlines -->
  <line x1="168" y1="158" x2="1060" y2="158" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="168" y1="218" x2="1060" y2="218" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="168" y1="278" x2="1060" y2="278" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="168" y1="338" x2="1060" y2="338" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="168" y1="398" x2="1060" y2="398" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="168" y1="450" x2="1060" y2="450" stroke="#e2e8f0" stroke-width="1"/>

  <!-- x-axis labels -->
  <text x="250" y="472" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 1</text>
  <text x="400" y="472" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 2</text>
  <text x="550" y="472" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 4</text>
  <text x="700" y="472" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 6</text>
  <text x="850" y="472" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 8</text>
  <text x="1000" y="472" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 12</text>

  <!-- progress line: rises then plateaus -->
  <polyline points="200,450 250,390 300,330 350,280 400,248 450,228 500,218 550,218 600,218 650,220 700,219 750,219 800,220 850,220 900,221 950,220 1000,220 1050,220" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plateau highlight band -->
  <rect x="490" y="202" width="580" height="34" rx="6" fill="#fef9c3" opacity="0.7"/>
  <text x="800" y="224" font-family="Inter,Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">PLATEAU — tracking feels pointless</text>

  <!-- annotations -->
  <circle cx="250" cy="390" r="8" fill="#10b981"/>
  <line x1="250" y1="382" x2="250" y2="310" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <rect x="170" y="278" width="160" height="36" rx="10" fill="#d1fae5"/>
  <text x="250" y="300" font-family="Inter,Arial,sans-serif" font-size="12" fill="#065f46" text-anchor="middle">Motivation peak</text>

  <circle cx="490" cy="222" r="8" fill="#ef4444"/>
  <line x1="490" y1="214" x2="490" y2="152" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
  <rect x="430" y="126" width="200" height="36" rx="10" fill="#fee2e2"/>
  <text x="530" y="148" font-family="Inter,Arial,sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle">Novelty wears off</text>

  <text x="600" y="549" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Why Habit Tracking Stops Working</text>
  <text x="600" y="588" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Breaking through the motivation plateau</text>
</svg>
