<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Best Habit Tracker for Privacy">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f5f3ff"/><stop offset="100%" stop-color="#f0fdf4"/></linearGradient>
    <linearGradient id="shield" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="280" r="220" fill="#7c3aed" opacity="0.07"/>

  <!-- large shield -->
  <path d="M600,60 L780,120 L780,290 Q780,380 600,460 Q420,380 420,290 L420,120 Z" fill="url(#shield)"/>
  <path d="M600,80 L762,134 L762,290 Q762,368 600,442 Q438,368 438,290 L438,134 Z" fill="#6d28d9"/>

  <!-- checkmark inside shield -->
  <polyline points="530,270 575,318 680,210" fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lock icon at top of shield -->
  <rect x="572" y="96" width="56" height="44" rx="10" fill="#4c1d95"/>
  <path d="M582 100 C582 78 618 78 618 100" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>

  <!-- feature badges around shield -->
  <rect x="60" y="150" width="270" height="62" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="195" y="176" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="600">No account required</text>
  <text x="195" y="199" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">zero signup friction</text>

  <rect x="60" y="246" width="270" height="62" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="195" y="272" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="600">Data stays on device</text>
  <text x="195" y="295" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">IndexedDB / local-first</text>

  <rect x="60" y="342" width="270" height="62" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="195" y="368" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="600">No analytics tracking</text>
  <text x="195" y="391" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">no third-party scripts</text>

  <rect x="870" y="150" width="270" height="62" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1005" y="176" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="600">Export your data</text>
  <text x="1005" y="199" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">no lock-in</text>

  <rect x="870" y="246" width="270" height="62" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1005" y="272" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="600">Open source</text>
  <text x="1005" y="295" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">verify what it does</text>

  <rect x="870" y="342" width="270" height="62" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1005" y="368" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="600">Sync is opt-in</text>
  <text x="1005" y="391" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">offline by default</text>

  <text x="600" y="553" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Best Habit Tracker for Privacy</text>
  <text x="600" y="592" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Your habits. Your data. No one else's business.</text>
</svg>
