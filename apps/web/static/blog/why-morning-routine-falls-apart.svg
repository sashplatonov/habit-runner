<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Why Morning Routines Fall Apart">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fffbeb"/><stop offset="100%" stop-color="#fef3c7"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- sun rising -->
  <circle cx="600" cy="520" r="180" fill="url(#sun)" opacity="0.5"/>
  <circle cx="600" cy="520" r="100" fill="#fbbf24" opacity="0.7"/>
  <!-- sun rays -->
  <line x1="600" y1="290" x2="600" y2="260" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="720" y1="330" x2="740" y2="310" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="760" y1="450" x2="790" y2="440" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="480" y1="330" x2="460" y2="310" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="440" y1="450" x2="410" y2="440" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- broken chain  -->
  <ellipse cx="350" cy="200" rx="60" ry="38" fill="none" stroke="#94a3b8" stroke-width="18"/>
  <line x1="410" y1="200" x2="460" y2="200" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="520" cy="200" rx="60" ry="38" fill="none" stroke="#94a3b8" stroke-width="18"/>
  <!-- break gap highlighted -->
  <line x1="580" y1="200" x2="600" y2="200" stroke="#ef4444" stroke-width="6" stroke-dasharray="8 4"/>
  <circle cx="610" cy="200" r="20" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <text x="610" y="206" font-family="Inter,Arial,sans-serif" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="700">✗</text>
  <!-- rest of chain broken / hanging -->
  <line x1="620" y1="200" x2="650" y2="210" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="700" cy="230" rx="60" ry="38" fill="none" stroke="#94a3b8" stroke-width="18" transform="rotate(20 700 230)"/>

  <!-- reason tags -->
  <rect x="120" y="280" width="200" height="50" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="220" y="310" font-family="Inter,Arial,sans-serif" font-size="16" fill="#7f1d1d" text-anchor="middle">Too ambitious</text>

  <rect x="340" y="310" width="180" height="50" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="430" y="340" font-family="Inter,Arial,sans-serif" font-size="16" fill="#7f1d1d" text-anchor="middle">No trigger</text>

  <rect x="540" y="270" width="200" height="50" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="640" y="300" font-family="Inter,Arial,sans-serif" font-size="16" fill="#7f1d1d" text-anchor="middle">Bad sleep</text>

  <rect x="760" y="310" width="220" height="50" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="870" y="340" font-family="Inter,Arial,sans-serif" font-size="16" fill="#7f1d1d" text-anchor="middle">All-or-nothing</text>

  <rect x="880" y="260" width="220" height="50" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="990" y="290" font-family="Inter,Arial,sans-serif" font-size="16" fill="#7f1d1d" text-anchor="middle">Phone first thing</text>

  <text x="600" y="545" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">Why Morning Routines Fall Apart</text>
  <text x="600" y="583" font-family="Inter,Arial,sans-serif" font-size="20" fill="#78716c" text-anchor="middle">The real reasons — and how to fix them</text>
</svg>
