<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="How to Stay Consistent with Habits">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="bar1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="550" r="150" fill="#34d399" opacity="0.08"/>
  <circle cx="1100" cy="100" r="130" fill="#06b6d4" opacity="0.08"/>

  <!-- bar chart: weekly consistency -->
  <rect x="150" y="100" width="900" height="390" rx="20" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="600" y="138" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">Weekly Consistency (past 8 weeks)</text>

  <!-- bars -->
  <!-- week labels at bottom -->
  <text x="225" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk1</text>
  <text x="330" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk2</text>
  <text x="435" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk3</text>
  <text x="540" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk4</text>
  <text x="645" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk5</text>
  <text x="750" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk6</text>
  <text x="855" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk7</text>
  <text x="960" y="450" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Wk8</text>

  <!-- gridlines -->
  <line x1="185" y1="165" x2="1010" y2="165" stroke="#f0fdf4" stroke-width="1"/>
  <line x1="185" y1="225" x2="1010" y2="225" stroke="#f0fdf4" stroke-width="1"/>
  <line x1="185" y1="285" x2="1010" y2="285" stroke="#f0fdf4" stroke-width="1"/>
  <line x1="185" y1="345" x2="1010" y2="345" stroke="#f0fdf4" stroke-width="1"/>
  <line x1="185" y1="430" x2="1010" y2="430" stroke="#e2e8f0" stroke-width="1"/>

  <!-- bar heights: 62%, 57%, 72%, 68%, 78%, 82%, 88%, 92% of 260px -->
  <rect x="193" y="269" width="64" height="161" rx="8" fill="#a7f3d0"/><text x="225" y="262" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">62%</text>
  <rect x="298" y="282" width="64" height="148" rx="8" fill="#6ee7b7"/><text x="330" y="275" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">57%</text>
  <rect x="403" y="243" width="64" height="187" rx="8" fill="url(#bar1)"/><text x="435" y="236" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">72%</text>
  <rect x="508" y="254" width="64" height="176" rx="8" fill="url(#bar1)"/><text x="540" y="247" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">68%</text>
  <rect x="613" y="227" width="64" height="203" rx="8" fill="url(#bar1)"/><text x="645" y="220" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">78%</text>
  <rect x="718" y="217" width="64" height="213" rx="8" fill="url(#bar1)"/><text x="750" y="210" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">82%</text>
  <rect x="823" y="201" width="64" height="229" rx="8" fill="url(#bar1)"/><text x="855" y="194" font-family="Inter,Arial,sans-serif" font-size="13" fill="#047857" text-anchor="middle">88%</text>
  <rect x="928" y="191" width="64" height="239" rx="8" fill="#059669"/><text x="960" y="184" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">92%</text>

  <!-- trend line -->
  <polyline points="225,272 330,285 435,246 540,257 645,230 750,220 855,204 960,194" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="8 4"/>

  <text x="600" y="549" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">How to Stay Consistent with Habits</text>
  <text x="600" y="587" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b" text-anchor="middle">The systems that make consistency an output, not a goal</text>
</svg>
