<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Why Streaks Break">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#fef2f2"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="100" r="180" fill="#f97316" opacity="0.08"/>

  <!-- intact chain links -->
  <ellipse cx="120" cy="290" rx="50" ry="32" fill="none" stroke="#94a3b8" stroke-width="18"/>
  <line x1="170" y1="290" x2="220" y2="290" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="270" cy="290" rx="50" ry="32" fill="none" stroke="#94a3b8" stroke-width="18"/>
  <line x1="320" y1="290" x2="370" y2="290" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="420" cy="290" rx="50" ry="32" fill="none" stroke="#94a3b8" stroke-width="18"/>
  <line x1="470" y1="290" x2="520" y2="290" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="570" cy="290" rx="50" ry="32" fill="none" stroke="#94a3b8" stroke-width="18"/>

  <!-- BREAK -->
  <g>
    <line x1="620" y1="290" x2="650" y2="280" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <line x1="650" y1="280" x2="680" y2="305" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <line x1="680" y1="305" x2="710" y2="282" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <line x1="710" y1="282" x2="740" y2="290" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <!-- break glow -->
    <circle cx="680" cy="292" r="26" fill="#fee2e2" opacity="0.8"/>
    <text x="680" y="298" font-family="Inter,Arial,sans-serif" font-size="22" fill="#ef4444" text-anchor="middle" font-weight="800">!</text>
  </g>

  <!-- dimmed broken chain -->
  <ellipse cx="790" cy="290" rx="50" ry="32" fill="none" stroke="#e2e8f0" stroke-width="18"/>
  <line x1="840" y1="290" x2="890" y2="290" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="940" cy="290" rx="50" ry="32" fill="none" stroke="#e2e8f0" stroke-width="18"/>
  <line x1="990" y1="290" x2="1040" y2="290" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="1090" cy="290" rx="50" ry="32" fill="none" stroke="#e2e8f0" stroke-width="18"/>

  <!-- reasons -->
  <rect x="180" y="380" width="200" height="60" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="280" y="405" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="600">Travel / disruption</text>
  <text x="280" y="426" font-family="Inter,Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle">#1 cause</text>

  <rect x="420" y="380" width="200" height="60" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="520" y="405" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="600">Habit too hard</text>
  <text x="520" y="426" font-family="Inter,Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle">lower the bar</text>

  <rect x="660" y="380" width="200" height="60" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="760" y="405" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="600">No reminder</text>
  <text x="760" y="426" font-family="Inter,Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle">add cue / trigger</text>

  <rect x="900" y="380" width="200" height="60" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="1000" y="405" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="600">Bad week</text>
  <text x="1000" y="426" font-family="Inter,Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle">use freeze days</text>

  <!-- solution badge -->
  <rect x="380" y="470" width="440" height="60" rx="18" fill="#d1fae5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="600" y="505" font-family="Inter,Arial,sans-serif" font-size="16" fill="#065f46" text-anchor="middle" font-weight="600">One miss isn't failure. Missing twice is the risk.</text>

  <text x="600" y="558" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle">Why Streaks Break</text>
  <text x="600" y="596" font-family="Inter,Arial,sans-serif" font-size="20" fill="#78716c" text-anchor="middle">The root causes — and how to protect your chain</text>
</svg>
