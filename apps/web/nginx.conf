server {
  listen 80;
  listen [::]:80;
  server_name _;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Versioned assets with hash in filename — long-term cache
  location ~* ^/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Icons and manifests — medium cache (updated less frequently)
  location ~* \.(png|svg|ico|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location /api/ {
    # CORS: handle preflight and ensure browser-visible headers are present.
    # NOTE: This is a safe, minimal change for deployments where the frontend
    # origin is https://habbit-runner.igo.mywire.org — if you have multiple
    # origins, replace the static origin with a proper map of allowed origins.
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' 'https://habbit-runner.igo.mywire.org' always;
      add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,x-trace-id' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain; charset=UTF-8';
      return 204;
    }

    # Ensure actual responses also include CORS headers so the browser accepts them
    add_header 'Access-Control-Allow-Origin' 'https://habbit-runner.igo.mywire.org' always;
    add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,x-trace-id' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    proxy_pass http://api:@@API_PORT@@/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Temporary: strip Origin so the upstream app won't reject CORS; handle CORS in nginx
    proxy_set_header Origin "";
  }

  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
