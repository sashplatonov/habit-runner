quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:18-alpine
quarkus.datasource.devservices.db-name=habbit_runner_it
quarkus.datasource.devservices.username=habbit
quarkus.datasource.devservices.password=integration-test-password
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=public
quarkus.hibernate-orm.statistics=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.create-schemas=true
quarkus.flyway.schemas=public
quarkus.flyway.default-schema=public
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
quarkus.log.level=ERROR
quarkus.log.console.json.enabled=false
quarkus.otel.enabled=false
quarkus.micrometer.export.newrelic.telemetry.enabled=false
quarkus.micrometer.export.newrelic.telemetry.api-key=integration-test-license
