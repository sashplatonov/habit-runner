quarkus.http.host=0.0.0.0
quarkus.http.port=${API_PORT}
quarkus.application.name=habittracker-api

quarkus.log.level=WARN
quarkus.log.category."com.sashplatonov.habbit.runner".level=INFO
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.netty".level=WARN
quarkus.log.category."io.vertx".level=WARN
quarkus.log.console.json.enabled=true
quarkus.log.console.json.log-format=ecs
quarkus.log.console.json.exception-output-type=formatted

# ECS emits @timestamp automatically. Request correlation is propagated via MDC traceId.

quarkus.datasource.db-kind=postgresql
# Optional DB schema to use for Flyway and Hibernate (configured via `DB_SCHEMA`)
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.datasource.jdbc.max-size=16
%prod.quarkus.datasource.jdbc.acquisition-timeout=5S
%prod.quarkus.datasource.jdbc.idle-removal-interval=5M
%prod.quarkus.datasource.jdbc.background-validation-interval=1M

# Ensure connections use the desired schema search_path so Hibernate and SQL operate on it
quarkus.datasource.jdbc.new-connection-sql=SET search_path TO ${DB_SCHEMA},public

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA}
quarkus.hibernate-orm.quote-identifiers.strategy=all

quarkus.flyway.migrate-at-start=true
# Allow Flyway to auto-baseline non-empty schemas that predate Flyway usage
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration
# Apply Flyway migrations into the configured schema
quarkus.flyway.schemas=${DB_SCHEMA}
quarkus.flyway.default-schema=${DB_SCHEMA}
# If the configured schema doesn't exist, allow Flyway to create it
quarkus.flyway.create-schemas=true

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,x-trace-id

quarkus.smallrye-openapi.path=/openapi

# ─── Micrometer / New Relic metrics ──────────────────────────────────────────
# JVM + HTTP server binders emit standard JVM and request latency metrics.
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true
%prod.quarkus.micrometer.export.newrelic.telemetry.enabled=true
quarkus.micrometer.export.newrelic.telemetry.api-key=${NEW_RELIC_LICENSE_KEY}
quarkus.micrometer.export.newrelic.telemetry.uri=${NEW_RELIC_METRIC_API_URI:-https://metric-api.newrelic.com/metric/v1}

# OpenTelemetry tracing is disabled by default in this repository. If you need
# OTLP traces, enable them in your environment and add an OTLP receiver (do NOT
# bake OTLP credentials into container images).
quarkus.otel.enabled=false

# ─── Structured JSON logging (stdout) ─────────────────────────────────────────
# ECS format is set above; trace_id / span_id are injected by Quarkus MDC when
# a span is active.
quarkus.log.console.json.additional-field.trace_id.value=%X{traceId}
quarkus.log.console.json.additional-field.span_id.value=%X{spanId}
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.console.json.additional-field."deployment.environment".value=${DEPLOYMENT_ENV:development}

quarkus.virtual-threads.enabled=true

auth.secret=${AUTH_SECRET}
auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS}
auth.refresh-token-days=${REFRESH_TOKEN_EXPIRES_DAYS}
auth.api-public-url=${API_PUBLIC_URL}
auth.oauth-default-return-to=${OAUTH_DEFAULT_RETURN_TO}
auth.google-client-id=${GOOGLE_OAUTH_CLIENT_ID}
auth.google-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
auth.issuer=${JWT_ISSUER}

notification.vapid-public-key=<REDACTED>

# ─── Development profile ─────────────────────────────────────────────────────
%dev.quarkus.log.category."com.sashplatonov.habbit.runner".level=DEBUG
%dev.quarkus.log.console.json.enabled=false
# Local host-based dev defaults: frontend on 5173, backend on 3000, compose DB on localhost:5432.
%dev.quarkus.http.port=3000
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:habbit_runner}
%dev.quarkus.datasource.username=${DB_USER:habbit}
%dev.quarkus.datasource.password=${DB_PASSWORD:password}
%dev.quarkus.datasource.jdbc.new-connection-sql=SET search_path TO ${DB_SCHEMA:habbit_runner},public
%dev.quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA:habbit_runner}
%dev.quarkus.flyway.schemas=${DB_SCHEMA:habbit_runner}
%dev.quarkus.flyway.default-schema=${DB_SCHEMA:habbit_runner}
%dev.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
%dev.auth.secret=${AUTH_SECRET:change-me}
%dev.auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS:3600}
%dev.auth.refresh-token-days=${REFRESH_TOKEN_EXPIRES_DAYS:30}
%dev.auth.api-public-url=${API_PUBLIC_URL:http://localhost:3000}
%dev.auth.oauth-default-return-to=${OAUTH_DEFAULT_RETURN_TO:http://localhost:5173}
%dev.auth.google-client-id=${GOOGLE_OAUTH_CLIENT_ID}
%dev.auth.google-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
%dev.auth.issuer=${JWT_ISSUER:habittracker-local}
%dev.notification.vapid-public-key=
# In dev mode disable observability export — no agent or remote metrics pipeline needed locally.
%dev.quarkus.otel.enabled=false
# ─── Test profile ─────────────────────────────────────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:habbit_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.jdbc.new-connection-sql=CREATE DOMAIN IF NOT EXISTS text AS CHARACTER VARYING
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.http.port=8081
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.database.default-schema=public
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.clean-at-start=false
%test.quarkus.flyway.create-schemas=false
%test.auth.secret=test-secret-for-unit-tests-1234567890
%test.auth.issuer=habittracker-test
%test.auth.access-token-ttl-seconds=3600
%test.auth.refresh-token-days=30
%test.auth.api-public-url=http://localhost:8081
%test.auth.oauth-default-return-to=http://localhost:5173
%test.notification.vapid-public-key=test-vapid-public-key
%test.quarkus.micrometer.export.newrelic.telemetry.api-key=test-license
%test.quarkus.micrometer.export.newrelic.telemetry.uri=https://metric-api.newrelic.com/metric/v1
%test.quarkus.log.level=ERROR
%test.quarkus.log.category."com.sashplatonov.habbit.runner".level=ERROR
%test.quarkus.log.category."com.sashplatonov.habbit.runner.api.GlobalExceptionMapper".level=OFF
%test.quarkus.log.category."com.sashplatonov.habbit.runner.auth.GoogleOAuthClient".level=OFF
%test.quarkus.log.category."org.hibernate.orm.jdbc.error".level=ERROR
%test.quarkus.log.console.json.enabled=false
%test.quarkus.otel.enabled=false
%test.quarkus.micrometer.export.newrelic.telemetry.enabled=false
%test.quarkus.vertx.max-event-loop-execute-time=10S
%test.quarkus.vertx.warning-exception-time=10S
