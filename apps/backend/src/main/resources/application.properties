quarkus.http.host=0.0.0.0
quarkus.http.port=${API_PORT}


quarkus.datasource.db-kind=postgresql
# Optional DB schema to use for Flyway and Hibernate (configured via `DB_SCHEMA`)
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}

# Ensure connections use the desired schema search_path so Hibernate and SQL operate on it
quarkus.datasource.jdbc.new-connection-sql=SET search_path TO ${DB_SCHEMA},public

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA}
quarkus.hibernate-orm.quote-identifiers.strategy=all

quarkus.flyway.migrate-at-start=true
# Allow Flyway to auto-baseline non-empty schemas that predate Flyway usage
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration
# Apply Flyway migrations into the configured schema
quarkus.flyway.schemas=${DB_SCHEMA}
quarkus.flyway.default-schema=${DB_SCHEMA}
# If the configured schema doesn't exist, allow Flyway to create it
quarkus.flyway.create-schemas=true

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,x-trace-id

quarkus.smallrye-openapi.path=/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.virtual-threads.enabled=true

auth.secret=${AUTH_SECRET}
auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS}
auth.refresh-token-days=${REFRESH_TOKEN_EXPIRES_DAYS}
auth.api-public-url=${API_PUBLIC_URL}
auth.oauth-default-return-to=${OAUTH_DEFAULT_RETURN_TO}
auth.google-client-id=${GOOGLE_OAUTH_CLIENT_ID}
auth.google-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
auth.issuer=${JWT_ISSUER}

notification.vapid-public-key=<REDACTED>


# OTLP exporter endpoint & headers should be supplied at runtime via environment variables:
# - OTEL_EXPORTER_OTLP_ENDPOINT (e.g. Grafana Cloud OTLP endpoint)
# - OTEL_EXPORTER_OTLP_HEADERS (e.g. Authorization=Bearer <API_KEY>)
# Optional: OTEL_RESOURCE_ATTRIBUTES or set `quarkus.otel.resource.attributes` here
# Prometheus scrape endpoint remains available at /q/metrics

# ─── Test profile ─────────────────────────────────────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:habbit_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.jdbc.new-connection-sql=CREATE DOMAIN IF NOT EXISTS jsonb AS JSON
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.http.port=8081
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.database.default-schema=public
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.clean-at-start=false
%test.quarkus.flyway.create-schemas=false
%test.auth.secret=test-secret-for-unit-tests-1234567890
%test.auth.issuer=habittracker-test
%test.auth.access-token-ttl-seconds=3600
%test.auth.refresh-token-days=30
%test.auth.api-public-url=http://localhost:8081
%test.auth.oauth-default-return-to=http://localhost:5173
