quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:3000}


quarkus.datasource.db-kind=postgresql
# Optional DB schema to use for Flyway and Hibernate (default: public)
# Set via environment: DB_SCHEMA=my_schema
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/habbit_runner}
quarkus.datasource.username=${DB_USER:habbit}
quarkus.datasource.password=${DB_PASSWORD:password}

# Ensure connections use the desired schema search_path so Hibernate and SQL operate on it
quarkus.datasource.jdbc.initial-sql=SET search_path TO ${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}},public

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}}
quarkus.hibernate-orm.quote-identifiers.strategy=all

quarkus.flyway.migrate-at-start=true
# Allow Flyway to auto-baseline non-empty schemas that predate Flyway usage
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration
# Apply Flyway migrations into the configured schema (defaults to public)
quarkus.flyway.schemas=${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}}
quarkus.flyway.default-schema=${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}}
# If the configured schema doesn't exist, allow Flyway to create it
quarkus.flyway.create-schemas=true

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,x-trace-id

quarkus.smallrye-openapi.path=/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.virtual-threads.enabled=true

auth.secret=${AUTH_SECRET:dev-secret}
auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS:3600}
auth.refresh-token-days=${REFRESH_TOKEN_EXPIRES_DAYS:30}
auth.api-public-url=${API_PUBLIC_URL:http://localhost:3000}
auth.oauth-default-return-to=${OAUTH_DEFAULT_RETURN_TO:http://localhost:5173}
auth.google-client-id=${GOOGLE_OAUTH_CLIENT_ID:}
auth.google-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
auth.issuer=${JWT_ISSUER:habittracker}

notification.vapid-public-key=<REDACTED>

# ─── Test profile ─────────────────────────────────────────────────────────────
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/habbit_test
%test.quarkus.datasource.username=habbit
%test.quarkus.datasource.password=password
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}}
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.datasource.jdbc.initial-sql=SET search_path TO ${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}},public
%test.quarkus.flyway.schemas=${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}}
%test.quarkus.flyway.default-schema=${DB_SCHEMA:${DEFAULT_DB_SCHEMA:public}}
%test.quarkus.flyway.create-schemas=true
%test.auth.secret=test-secret-for-unit-tests-1234567890
%test.auth.issuer=habittracker-test
%test.auth.access-token-ttl-seconds=3600
%test.auth.refresh-token-days=30
%test.auth.api-public-url=http://localhost:8081
%test.auth.oauth-default-return-to=http://localhost:5173
