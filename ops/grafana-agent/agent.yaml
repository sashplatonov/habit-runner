# Grafana Agent (classic) configuration for habittracker-api
# All credentials are sourced from environment variables.
# Reload: sudo systemctl reload grafana-agent
# Validate: grafana-agent --config.file=agent.yaml --config.check-syntax

server:
  log_level: warn
  # Disable the HTTP API server (not needed in production; Agent is not accessed remotely)
  http_listen_port: 0

# ─── Metrics ──────────────────────────────────────────────────────────────────
# Scrapes Quarkus /q/metrics from the management port published on 127.0.0.1:9000
# then remote_writes to Grafana Cloud Mimir (Prometheus-compatible).
metrics:
  global:
    scrape_interval: 15s
    external_labels:
      service: habittracker-api
      environment: ${DEPLOYMENT_ENV:-${ENVIRONMENT:-production}}

  wal_directory: /tmp/grafana-agent-wal

  configs:
    - name: habittracker-metrics
      scrape_configs:
        - job_name: habittracker-api
          static_configs:
            - targets: ['localhost:9000']
              labels:
                service: habittracker-api
          metrics_path: /q/metrics
          scrape_interval: 15s

      remote_write:
        - url: ${GRAFANA_MIMIR_URL}
          basic_auth:
            username: ${GRAFANA_MIMIR_USERNAME}
            password: ${GRAFANA_METRICS_API_KEY}

# Traces and logs are intentionally excluded in this minimal Agent config.
# This file configures only metrics scraping + remote_write to Grafana Cloud Mimir.
