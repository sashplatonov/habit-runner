version: "3.9"

# Local, self-contained compose for JVM-mode local development. Uses
# `apps/backend/Dockerfile.jvm` which bundles a Quarkus run JAR and includes curl
# for container healthchecks.

x-service-defaults: &service_defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service_defaults
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-habbit_runner}
      POSTGRES_USER: ${DB_USER:-habbit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - habbit_runner_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-habbit} -d ${DB_NAME:-habbit_runner}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service_defaults
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.jvm
    init: true
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-habbit_runner}
      DB_USER: ${DB_USER:-habbit}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      API_PORT: ${API_PORT:-8080}
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "${API_PORT:-8080}"
      - "9000"
    healthcheck:
      test: ["CMD-SHELL","curl -f http://127.0.0.1:9000/q/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  web:
    <<: *service_defaults
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    init: true
    environment:
      API_PORT: ${API_PORT:-8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "80"
    networks:
      - backend

volumes:
  habbit_runner_pgdata:

networks:
  backend:
    driver: bridge
