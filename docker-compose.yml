x-service-defaults: &service_defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service_defaults
    image: postgres:18-alpine
    environment:
      # Use app-specific variable names to avoid Dokploy or host-level
      # POSTGRES_* values leaking into initdb and breaking Postgres 18 startup.
      POSTGRES_DB: ${HR_DB_NAME:-habbit_runner}
      POSTGRES_USER: ${HR_DB_USER:-habbit}
      POSTGRES_PASSWORD: ${HR_DB_PASSWORD:-password}
      # Force C locale on alpine (no locales installed); required for PG 18 initdb.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HR_DB_USER:-habbit} -d ${HR_DB_NAME:-habbit_runner}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service_defaults
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - packages/server/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=Number(process.env.PORT||4000);const net=require('node:net');const socket=net.connect({host:'127.0.0.1',port:p},()=>{socket.destroy();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2500);\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - backend
      - edge

  web:
    <<: *service_defaults
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    init: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${WEB_PORT:-5173}:80"
    networks:
      - edge

volumes:
  pgdata18:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
