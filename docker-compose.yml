# Local, self-contained compose for JVM-mode local development. Uses
# `apps/backend/Dockerfile` which bundles a Quarkus run JAR and includes curl
# for container healthchecks.

x-service-defaults: &service_defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service_defaults
    profiles:
      - db
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-habbit_runner}
      POSTGRES_USER: ${DB_USER:-habbit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - habbit_runner_pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-habbit} -d ${DB_NAME:-habbit_runner}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service_defaults
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    init: true
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME:-habbit_runner}
      DB_USER: ${DB_USER:-habbit}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      API_PORT: ${API_PORT:-8080}
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5137/api}
      OAUTH_DEFAULT_RETURN_TO: ${OAUTH_DEFAULT_RETURN_TO:-http://localhost:5137}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5137}
      JWT_ISSUER: ${JWT_ISSUER:-habittracker}
      VAPID_PUBLIC_KEY: <REDACTED>
      VAPID_PRIVATE_KEY: <REDACTED>
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-habittracker-api}
      NEW_RELIC_AGENT_ENABLED: ${NEW_RELIC_AGENT_ENABLED:-false}
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: ${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED:-false}
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED: ${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED:-10000}
      NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: ${NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "${API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:${API_PORT:-8080}/q/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend
      - dokploy-ipv6

  web:
    <<: *service_defaults
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SYNC_ENABLED: ${VITE_SYNC_ENABLED:-true}
        VITE_DEFAULT_USER_ID: ${VITE_DEFAULT_USER_ID:-}
        VITE_GSC_VERIFICATION_TOKEN: ${VITE_GSC_VERIFICATION_TOKEN:-}
        VITE_BING_VERIFICATION_TOKEN: ${VITE_BING_VERIFICATION_TOKEN:-}
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_NEW_RELIC_BROWSER_ENABLED: ${VITE_NEW_RELIC_BROWSER_ENABLED:-false}
        VITE_NEW_RELIC_BROWSER_INFO: ${VITE_NEW_RELIC_BROWSER_INFO:-}
        VITE_NEW_RELIC_BROWSER_INIT: ${VITE_NEW_RELIC_BROWSER_INIT:-}
        VITE_NEW_RELIC_BROWSER_LOADER_CONFIG: ${VITE_NEW_RELIC_BROWSER_LOADER_CONFIG:-}
    init: true
    environment:
      API_PORT: ${API_PORT:-8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://habbit-runner.igo.mywire.org}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "80"
    networks:
      - backend

volumes:
  habbit_runner_pgdata:

networks:
  backend:
    driver: bridge
  # ⚠️ DO NOT REMOVE: dokploy-ipv6 — Dokploy external network for IPv6 routing.
  # Required for Dokploy reverse-proxy to reach the backend.
  dokploy-ipv6:
    external: true
