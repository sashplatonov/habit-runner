x-service-defaults: &service_defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service_defaults
    profiles:
      - db
    image: postgres:18-alpine
    environment:
      # Use app-specific variable names to avoid Dokploy or host-level
      # POSTGRES_* values leaking into initdb and breaking Postgres 18 startup.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Force C locale on alpine (no locales installed); required for PG 18 initdb.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - habbit_runner_pgdata18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service_defaults
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.jvm
      # platform is intentionally not set here; set locally in docker-compose.local.yml if needed
    init: true
    environment:
      # Pass canonical DB_* to the api container (no inline defaults here)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      API_PORT: ${API_PORT}
      JWT_ISSUER: ${JWT_ISSUER}
      AUTH_SECRET: ${AUTH_SECRET}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      OAUTH_DEFAULT_RETURN_TO: ${OAUTH_DEFAULT_RETURN_TO}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      VAPID_PUBLIC_KEY: <REDACTED>
      VAPID_PRIVATE_KEY: <REDACTED>
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # ── Observability – metrics via host Grafana Agent
      # Metrics are scraped by the Agent from management port 9000 — no push env vars needed.
      # Keep container free of Grafana/Loki/OTLP credentials; configure them on the host Agent.
      SERVICE_VERSION: "${SERVICE_VERSION:-local}"
      APP_VERSION: "${APP_VERSION:-${SERVICE_VERSION:-local}}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DEPLOYMENT_ENV: "${DEPLOYMENT_ENV:-${ENVIRONMENT:-development}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Do NOT publish the API port to the host. Keep it internal to the compose
    # network so other services (like `web`) can reach it by service name.
    expose:
      - "${API_PORT}"
    # 9000 published only on loopback — reachable by Grafana Agent on VPS, NOT public
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'curl -f http://127.0.0.1:${API_PORT}/q/health >/dev/null 2>&1 || exit 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend
      - edge
      - dokploy-ipv6

  web:
    <<: *service_defaults
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # platform is intentionally not set here; set locally in docker-compose.local.yml if needed
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        # Build-time args for the web bundle (only API base required here)
    init: true
    environment:
      API_PORT: ${API_PORT}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "${WEB_PORT}"
    networks:
      - edge

volumes:
  habbit_runner_pgdata18:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  dokploy-ipv6:
    external: true
