# Local, self-contained compose for native-mode local development. This file is
# intended to be safe to run via `docker compose -f docker-compose.yml up -d --build`.
# If your project Java version is newer than the default Mandrel builder, set
# the `MANDREL_BUILDER_IMAGE` env var (or change the `build.args.MANDREL_BUILDER_IMAGE` below).

x-service-defaults: &service_defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service_defaults
    profiles:
      - db
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-habbit_runner}
      POSTGRES_USER: ${DB_USER:-habbit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - habbit_runner_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-habbit} -d ${DB_NAME:-habbit_runner}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service_defaults
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        # Override this if you need a different Mandrel/Graal builder image.
        # Default uses a Mandrel builder image targeting JDK 25 that includes
        # the native-image toolchain.
        MANDREL_BUILDER_IMAGE: ${MANDREL_BUILDER_IMAGE:-quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25}
    init: true
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-habbit_runner}
      DB_USER: ${DB_USER:-habbit}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      API_PORT: ${API_PORT:-8080}
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-3600}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5137}
      OAUTH_DEFAULT_RETURN_TO: ${OAUTH_DEFAULT_RETURN_TO:-http://localhost:5137/auth/callback}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5137}
      JWT_ISSUER: ${JWT_ISSUER:-habittracker}
      VAPID_PUBLIC_KEY: <REDACTED>
      VAPID_PRIVATE_KEY: <REDACTED>
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "${API_PORT:-8080}"
      - "9000"
    # NOTE: native runtime images often don't include curl/wget — therefore
    # we do NOT declare an HTTP healthcheck here. If you add a runtime image
    # that contains curl, you can add a healthcheck similar to the JVM compose.
    networks:
      - backend

  web:
    <<: *service_defaults
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SYNC_ENABLED: ${VITE_SYNC_ENABLED:-true}
        VITE_DEFAULT_USER_ID: ${VITE_DEFAULT_USER_ID:-}
        VITE_GSC_VERIFICATION_TOKEN: ${VITE_GSC_VERIFICATION_TOKEN:-}
        VITE_BING_VERIFICATION_TOKEN: ${VITE_BING_VERIFICATION_TOKEN:-}
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_FARO_URL: ${VITE_FARO_URL:-}
        VITE_FARO_APP_NAME: ${VITE_FARO_APP_NAME:-Habbit Runner}
        VITE_FARO_APP_VERSION: ${VITE_FARO_APP_VERSION:-1.0.0}
        VITE_FARO_ENVIRONMENT: ${VITE_FARO_ENVIRONMENT:-production}
        VITE_FARO_SAMPLING_RATE: ${VITE_FARO_SAMPLING_RATE:-1}
        VITE_FARO_PERSISTENT_SESSIONS: ${VITE_FARO_PERSISTENT_SESSIONS:-false}
        VITE_FARO_ENABLED: ${VITE_FARO_ENABLED:-true}
    init: true
    environment:
      API_PORT: ${API_PORT:-8080}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "80"
    networks:
      - backend

volumes:
  habbit_runner_pgdata:

networks:
  backend:
    driver: bridge

