x-service-defaults: &service_defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service_defaults
    profiles:
      - db
    image: postgres:18-alpine
    environment:
      # Use app-specific variable names to avoid Dokploy or host-level
      # POSTGRES_* values leaking into initdb and breaking Postgres 18 startup.
      POSTGRES_DB: ${HR_DB_NAME:-habbit_runner}
      POSTGRES_USER: ${HR_DB_USER:-habbit}
      POSTGRES_PASSWORD: ${HR_DB_PASSWORD:-password}
      # Force C locale on alpine (no locales installed); required for PG 18 initdb.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - habbit_runner_pgdata18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HR_DB_USER:-habbit} -d ${HR_DB_NAME:-habbit_runner}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *service_defaults
    build:
      context: .
      dockerfile: apps/api-java/Dockerfile
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://habbit:password@db:5432/habbit_runner}
      DEFAULT_DB_SCHEMA: ${DEFAULT_DB_SCHEMA:-habbit_runner}
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-1h}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:${WEB_PORT:-80}/api}
      OAUTH_DEFAULT_RETURN_TO: ${OAUTH_DEFAULT_RETURN_TO:-http://localhost:${WEB_PORT:-80}}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: <REDACTED>
      VAPID_PRIVATE_KEY: <REDACTED>
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@habbit-runner.app}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -lc 'exec 3<>/dev/tcp/127.0.0.1/${PORT:-3000}'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend
      - edge
      - dokploy-ipv6

  web:
    <<: *service_defaults
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    init: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "${WEB_PORT:-80}"
    networks:
      - edge

volumes:
  habbit_runner_pgdata18:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  dokploy-ipv6:
    external: true
