# Dokploy deployment Compose entry point. Keep the deployable services explicit
# because Dokploy validates domain targets from this file before Compose starts.

services:
  api:
    extends:
      file: ./docker-compose.yml
      service: api
    networks:
      - backend
      - dokploy-ipv6

  web:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEFAULT_USER_ID: ${VITE_DEFAULT_USER_ID:-}
        VITE_GSC_VERIFICATION_TOKEN: ${VITE_GSC_VERIFICATION_TOKEN:-}
        VITE_BING_VERIFICATION_TOKEN: ${VITE_BING_VERIFICATION_TOKEN:-}
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_NEW_RELIC_BROWSER_ENABLED: ${VITE_NEW_RELIC_BROWSER_ENABLED:-false}
        VITE_NEW_RELIC_BROWSER_INFO: ${VITE_NEW_RELIC_BROWSER_INFO:-}
        VITE_NEW_RELIC_BROWSER_INIT: ${VITE_NEW_RELIC_BROWSER_INIT:-}
        VITE_NEW_RELIC_BROWSER_LOADER_CONFIG: ${VITE_NEW_RELIC_BROWSER_LOADER_CONFIG:-}
    init: true
    environment:
      API_PORT: ${API_PORT:-8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://habbit-runner.igo.mywire.org}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
      - dokploy-ipv6

networks:
  backend:
    driver: bridge
  dokploy-ipv6:
    external: true
