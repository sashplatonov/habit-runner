# Dokploy deployment Compose entry point. Keep the deployable services explicit
# because Dokploy validates domain targets from this file before Compose starts.

services:
  api:
    extends:
      file: ./docker-compose.yml
      service: api
    networks:
      - backend
      - dokploy-ipv6

  web:
    extends:
      file: ./docker-compose.yml
      service: web
    ports: !reset []
    networks:
      - backend
      - dokploy-ipv6

networks:
  backend:
    driver: bridge
  dokploy-ipv6:
    external: true
