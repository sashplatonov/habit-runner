name: Quality

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: spotbugs-reports
          path: |
            apps/backend/target/spotbugs
            apps/backend/target/spotbugs.xml
            apps/backend/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  verify-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify PostgreSQL integration suite
        run: ./mvnw -B -ntp verify -Ppostgres-it

      - name: Upload PostgreSQL diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: postgres-integration-reports
          path: |
            apps/backend/target/surefire-reports
            apps/backend/target/failsafe-reports
            apps/backend/target/quarkus.log
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run backend security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/backend
          scanners: vuln,secret,misconfig
          exit-code: '1'
          severity: HIGH,CRITICAL
          skip-dirs: target
          cache-dir: ${{ runner.temp }}/.trivy-cache

      - name: Run frontend security scan
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/web
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: '1'
          severity: HIGH,CRITICAL
          skip-dirs: node_modules,dist,.svelte-kit,coverage,.vite
          cache-dir: ${{ runner.temp }}/.trivy-cache
          cache: 'false'
          skip-setup-trivy: true

  verify-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check:web
