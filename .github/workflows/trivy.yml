name: Trivy Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.5
        with:
          cache: true
          version: v0.69.3

      - name: Run Trivy scan
        id: trivy-scan
        shell: bash
        run: |
          set -uo pipefail

          scan_exit=0
          trivy fs . \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --vuln-type os,library || scan_exit=$?

          if [ "$scan_exit" -gt 1 ]; then
            echo "Trivy failed with exit code $scan_exit"
            exit $scan_exit
          fi

          if [ "$scan_exit" -eq 1 ]; then
            echo "Trivy found critical/high vulnerabilities"
            exit 1
          fi

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
