quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:3000}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/habbit_runner}
quarkus.datasource.username=${DB_USER:habbit}
quarkus.datasource.password=${DB_PASSWORD:password}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.quote-identifiers.strategy=all

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,x-trace-id

quarkus.smallrye-openapi.path=/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.virtual-threads.enabled=true

auth.secret=${AUTH_SECRET:dev-secret}
auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS:3600}
auth.refresh-token-days=${REFRESH_TOKEN_EXPIRES_DAYS:30}
auth.api-public-url=${API_PUBLIC_URL:http://localhost:3000}
auth.oauth-default-return-to=${OAUTH_DEFAULT_RETURN_TO:http://localhost:5173}
auth.google-client-id=${GOOGLE_OAUTH_CLIENT_ID:}
auth.google-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
auth.issuer=${JWT_ISSUER:habittracker}

notification.vapid-public-key=<REDACTED>
